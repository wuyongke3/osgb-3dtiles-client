<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cesium.com https://assets.cesium.com blob: data:; worker-src 'self' blob: 'unsafe-inline' https://cesium.com https://assets.cesium.com; connect-src * blob: data:;" />
  <title>3D Tiles 预览 - Cesium</title>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #cesiumContainer {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }
    .cesium-viewer-bottom { display: none !important; }

    .preview-topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px;
      background: linear-gradient(to bottom, rgba(15,25,35,0.95) 0%, rgba(15,25,35,0.7) 70%, transparent 100%);
      pointer-events: none;
    }
    .preview-topbar > * { pointer-events: auto; }
    .preview-title {
      font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
      font-size: 18px; font-weight: 600; color: #e8f0f8;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    .preview-info {
      font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
      font-size: 14px; color: #7a8fa5; display: flex; gap: 16px; align-items: center;
    }
    .preview-badge {
      display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: 500;
      background: rgba(74,144,217,0.2); color: #5da0e8; border: 1px solid rgba(74,144,217,0.4);
    }

    .loading-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
      color: #c8d6e5; font-size: 16px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      transition: opacity 0.5s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(74,144,217,0.3); border-top-color: #4a90d9;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-banner {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 20;
      padding: 14px 28px; background: rgba(224,85,85,0.92); color: #fff;
      font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
      font-size: 16px; border-radius: 8px; display: none;
    }
    .error-banner.show { display: block; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <div class="preview-topbar">
    <span class="preview-title">3D Tiles 预览</span>
    <span class="preview-info">
      <span class="preview-badge" id="tilesetLabel">加载中...</span>
      <span id="coordLabel"></span>
    </span>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <span>正在加载 3D Tiles ...</span>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
  <script>
    // Read params: first try URL query string, then fallback to server-injected __PREVIEW_PARAMS__
    var params = new URLSearchParams(window.location.search)
    if ((!params.get('url') || params.get('url') === 'null') && window.__PREVIEW_PARAMS__) {
      params = new URLSearchParams(window.__PREVIEW_PARAMS__)
    }
    var tilesetUrl = params.get('url')
    var centerX = parseFloat(params.get('x') || '0')
    var centerY = parseFloat(params.get('y') || '0')
    var centerHeight = parseFloat(params.get('h') || '0')

    var errorBanner = document.getElementById('errorBanner')
    var loadingOverlay = document.getElementById('loadingOverlay')
    var tilesetLabel = document.getElementById('tilesetLabel')
    var coordLabel = document.getElementById('coordLabel')

    coordLabel.textContent = '中心: ' + centerX.toFixed(6) + '°, ' + centerY.toFixed(6) + '°'

    function showError(msg) {
      errorBanner.textContent = '加载失败: ' + msg
      errorBanner.classList.add('show')
      loadingOverlay.classList.add('hidden')
    }

    if (!tilesetUrl) {
      showError('缺少 tileset URL 参数')
    }

    // Resolve relative URL to absolute (same-origin with the page)
    if (tilesetUrl && !/^https?:\/\//i.test(tilesetUrl)) {
      tilesetUrl = new URL(tilesetUrl, window.location.href).href
    }

    // Wait for Cesium to be fully loaded
    function waitForCesium(cb) {
      if (typeof Cesium !== 'undefined' && Cesium.Viewer && Cesium.Cesium3DTileset && Cesium.Cesium3DTileset.fromUrl) {
        cb()
      } else {
        setTimeout(function () { waitForCesium(cb) }, 100)
      }
    }

    waitForCesium(function () {
      try {
        Cesium.Ion.defaultAccessToken =
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlYWE1OWUxNy1mMWZiLTQzYjYtYTQ0OS1kMWFjYmFkNjc5YzciLCJpZCI6NTc3MzMsImlhdCI6MTYyNzg0NTE4MH0.XcKpgANiY19MC4bdFUXMVEBToBmqS8kuYpUlxJHYZxk'

        // Create viewer WITHOUT terrain (avoid Cesium Ion dependency for terrain)
        var viewer = new Cesium.Viewer('cesiumContainer', {
          baseLayerPicker: false,
          geocoder: false,
          homeButton: false,
          sceneModePicker: false,
          navigationHelpButton: false,
          animation: false,
          timeline: false,
          fullscreenButton: false,
          vrButton: false,
          infoBox: true,
          selectionIndicator: true,
          sceneMode: Cesium.SceneMode.SCENE3D,
        })

        // Hide credit container
        try {
          viewer._cesiumWidget._creditContainer.style.display = 'none'
        } catch (e) {}

        // Enable depth test
        viewer.scene.globe.depthTestAgainstTerrain = true

        // Load 3D Tiles via Cesium3DTileset.fromUrl (new Cesium3DTileset is deprecated since 1.104)
        Cesium.Cesium3DTileset.fromUrl(tilesetUrl, {
          maximumScreenSpaceError: 16,
          skipLevelOfDetail: true,
          baseScreenSpaceError: 1024,
          skipScreenSpaceErrorFactor: 16,
          immediatelyLoadDesiredLevelOfDetail: false,
          loadSiblings: false,
          cullWithChildrenBounds: true,
        })
          .then(function (tileset) {
            viewer.scene.primitives.add(tileset)

            loadingOverlay.classList.add('hidden')

            var boundingSphere = tileset.boundingSphere
            var cartographic = Cesium.Cartographic.fromCartesian(boundingSphere.center)

            tilesetLabel.textContent =
              '中心: ' + (cartographic.longitude * 180 / Math.PI).toFixed(6) + '°, ' +
              (cartographic.latitude * 180 / Math.PI).toFixed(6) + '°'

            coordLabel.textContent =
              '范围: ' + boundingSphere.radius.toFixed(0) + 'm'

            viewer.camera.flyTo({
              destination: Cesium.Cartesian3.fromDegrees(
                centerX || (cartographic.longitude * 180 / Math.PI),
                centerY || (cartographic.latitude * 180 / Math.PI),
                boundingSphere.radius + 100
              ),
              orientation: {
                heading: Cesium.Math.toRadians(0),
                pitch: Cesium.Math.toRadians(-90),
                roll: 0,
              },
              duration: 2.5,
            })

            // Keyboard shortcuts
            document.addEventListener('keydown', function (e) {
              var bs = tileset.boundingSphere
              if (e.key === 'r' || e.key === 'R') {
                if (bs) {
                  viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(
                      centerX, centerY,
                      Math.max(bs.radius * 1.8, centerHeight + 500)
                    ),
                    orientation: {
                      heading: Cesium.Math.toRadians(0),
                      pitch: Cesium.Math.toRadians(-35),
                      roll: 0,
                    },
                    duration: 2,
                  })
                }
              }
              if (e.key === 't' || e.key === 'T') {
                if (bs) {
                  viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(
                      centerX, centerY,
                      bs.radius * 2.5
                    ),
                    orientation: {
                      heading: Cesium.Math.toRadians(0),
                      pitch: Cesium.Math.toRadians(-90),
                      roll: 0,
                    },
                    duration: 1.5,
                  })
                }
              }
            })
          })
          .catch(function (err) {
            showError(err.message || '无法加载 tileset')
            console.error('Tileset load error:', err)
          })

        window.addEventListener('resize', function () {
          viewer.resize()
        })

      } catch (err) {
        showError('Cesium 初始化失败: ' + (err && err.message ? err.message : String(err)))
        console.error('Cesium init error:', err)
      }
    })
  </script>
</body>
</html>
